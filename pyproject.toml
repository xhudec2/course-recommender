[project]
name = "course-recommender"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "altair<5",
    "bs4>=0.0.2",
    "chromadb>=1.5.5",
    "fastapi[standard]>=0.135.3",
    "ipykernel>=7.2.0",
    "jupyter>=1.1.1",
    "mypy>=1.20.0",
    "ollama>=0.6.1",
    "pandas<3",
    "pandas-stubs>=3.0.0.260204",
    "streamlit>=1.24.0",
    "torch>=2.10.0",
    "types-requests>=2.33.0.20260408",
    "watchdog>=6.0.0",
]


[tool.mypy]
strict = true
follow_untyped_imports = false
disallow_any_generics = false
warn_return_any = false
no_implicit_optional = false


[[tool.mypy.overrides]]
module = "recommender.db.*"
disable_error_code = ["dict-item", "return-value"]
